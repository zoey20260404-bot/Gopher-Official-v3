[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gopher-agent"
version = "0.1.0"
description = "基于 FastAPI 与 LangGraph 的企业级 Python Agent 服务"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "langgraph>=0.4,<2",
    "opentelemetry-api>=1.29,<2",
    "opentelemetry-sdk>=1.29,<2",
    "pydantic-settings>=2.7,<3",
    "redis>=5.2,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.14,<2",
    "pre-commit>=4.0,<5",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6.0,<7",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gopher_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["*.md", "pytest-cache-files-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = [
    "RUF002", # 中文文档字符串使用中文标点
    "RUF003", # 中文注释使用中文标点
    "S101",   # pytest 使用 assert 表达测试断言
]

[tool.ruff.lint.isort]
known-first-party = ["gopher_agent"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --strict-markers --strict-config --cov=gopher_agent --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.coverage.run]
branch = true
source = ["gopher_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
